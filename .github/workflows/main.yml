on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'gradle'
          
      - run: ./gradlew spotlessCheck
      - run: ./gradlew build